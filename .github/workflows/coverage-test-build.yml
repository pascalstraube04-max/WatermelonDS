name: Vulkan Coverage Fix Test Build

on:
  push:
    branches:
      - ci/vulkan-coverage-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned Android NDK
        run: |
          sdkmanager "ndk;28.0.13004108"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Regenerate Vulkan SPIR-V shaders
        run: ./scripts/regenerate_vulkan_spirv.sh

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Build unsigned debug APK
        timeout-minutes: 40
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleGitHubProdDebug --no-daemon --console=plain --stacktrace 2>&1 | tee build-debug-apk.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watermelon-vulkan-coverage-build-log
          path: build-debug-apk.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: watermelon-vulkan-coverage-debug
          path: app/build/outputs/apk/gitHubProd/debug/*.apk
          if-no-files-found: error
          retention-days: 14

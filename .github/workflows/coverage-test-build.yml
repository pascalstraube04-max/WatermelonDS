name: Vulkan Coverage Fix Test Build

on:
  push:
    branches:
      - ci/vulkan-coverage-test
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulkan-coverage-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned Android NDK
        run: |
          sdkmanager "ndk;28.0.13004108"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Regenerate Vulkan SPIR-V shaders
        run: ./scripts/regenerate_vulkan_spirv.sh

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Build Android-signed isolated debug APK
        timeout-minutes: 40
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleGitHubProdDebug --no-daemon --console=plain --stacktrace 2>&1 | tee build-debug-apk.log

      - name: Create temporary CI signing key for isolated optimized test APK
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/watermelon-coverage-test.jks" \
            -storepass "${{ github.run_id }}-${{ github.run_attempt }}-test" \
            -alias coverage-test \
            -keypass "${{ github.run_id }}-${{ github.run_attempt }}-test" \
            -dname "CN=WatermelonDS Coverage Test, OU=CI, O=WatermelonDS" \
            -keyalg RSA -keysize 2048 -validity 3650
          cat > local.properties <<EOF
          MELONDS_KEYSTORE=$RUNNER_TEMP/watermelon-coverage-test.jks
          MELONDS_KEYSTORE_PASSWORD=${{ github.run_id }}-${{ github.run_attempt }}-test
          MELONDS_KEY_ALIAS=coverage-test
          MELONDS_KEY_PASSWORD=${{ github.run_id }}-${{ github.run_attempt }}-test
          EOF

      - name: Build optimized isolated release APK
        timeout-minutes: 40
        run: |
          set -o pipefail
          ./gradlew :app:assembleGitHubNightlyRelease --no-daemon --console=plain --stacktrace 2>&1 | tee build-release-apk.log

      - name: Upload optimized release build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watermelon-vulkan-coverage-release-build-log
          path: build-release-apk.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload optimized isolated release APK
        uses: actions/upload-artifact@v4
        with:
          name: watermelon-vulkan-coverage-release
          path: app/build/outputs/apk/gitHubNightly/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watermelon-vulkan-coverage-build-log
          path: build-debug-apk.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: watermelon-vulkan-coverage-debug
          path: app/build/outputs/apk/gitHubProd/debug/*.apk
          if-no-files-found: error
          retention-days: 14

# Retry trigger: restart a stale GitHub Actions runner without changing build behavior.
